name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: app
            java: '25'
          - app: zt-app
            java: '21'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        working-directory: ${{ matrix.app }}
        run: ./mvnw -B --no-transfer-progress verify

  lint:
    name: Lint scripts and configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          shellcheck -S warning deploy-ziti.sh infrastructure/deploy.sh \
            scripts/fetch-console.sh scripts/build-console.sh \
            scripts/console-demo/run-demo.sh scripts/console-demo/seed.sh

      - name: Validate compose files
        env:
          OPENZITI_ADMIN_PASSWORD: ci-placeholder-password
          CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder-token
        run: |
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f infrastructure/docker-compose.cloudflare.yaml config --quiet

      - name: Diagrams match their generator
        run: |
          python3 scripts/diagrams/build_diagrams.py
          git diff --exit-code -- assets/diagrams/
