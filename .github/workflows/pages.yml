name: Publish GitHub Pages

# Publishes the Why Use OpenZiti browser slideshow and its SVG diagrams to GitHub Pages:
#   https://moscait.github.io/baked-pasta/docs/why-openziti-slides.html
on:
  push:
    branches:
      - main
    paths:
      - 'docs/why-openziti-slides.html'
      - 'assets/diagrams/why-*.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy slideshow to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage static site
        run: |
          mkdir -p _site/docs _site/assets/diagrams
          cp docs/why-openziti-slides.html _site/docs/
          cp assets/diagrams/why-*.svg _site/assets/diagrams/
          touch _site/.nojekyll
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=docs/why-openziti-slides.html">
            <title>Why Use OpenZiti? — Slide Show</title>
          </head>
          <body>
            <p>Redirecting to <a href="docs/why-openziti-slides.html">Why Use OpenZiti? Slide Show</a>…</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
