<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Oracle Cloud host</title>
<desc id="d">An Always Free Oracle Cloud instance with a reserved public IP. The VCN security list admits SSH only from your IP and OpenZiti mTLS on 1280 and 8444 from anywhere. The administrator reaches the console through Cloudflare Access and a tunnel the instance dials outbound. deploy-ziti.sh installs the host firewall, container engine and OpenZiti.</desc>
<defs>
<marker id="arr-http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9FC2B8"/></marker>
<marker id="arr-overlay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF7A4D"/></marker>
</defs>
<rect width="1000" height="520" rx="14" fill="#0F1A18"/>
<text x="32" y="42" font-size="19" font-weight="700" fill="#F6ECDC" text-anchor="start">Oracle Cloud host</text>
<text x="32" y="63" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">Always Free instance; the security list admits only SSH from your IP and OpenZiti mTLS.</text>
<line x1="664" y1="46" x2="690" y2="46" stroke="#9FC2B8" stroke-width="2.5"/>
<text x="698" y="50" font-size="12" font-weight="600" fill="#A8B8B2" text-anchor="start">HTTP(S)</text>
<line x1="774" y1="46" x2="800" y2="46" stroke="#FF7A4D" stroke-width="2.5"/>
<text x="808" y="50" font-size="12" font-weight="600" fill="#A8B8B2" text-anchor="start">OpenZiti mTLS overlay</text>
<rect x="40" y="96" width="240" height="64" rx="10" fill="#1E322C" stroke="#3D5A53" stroke-width="1.5"/>
<text x="56" y="122" font-size="15" font-weight="650" fill="#F6ECDC" text-anchor="start">Admin browser</text>
<text x="56" y="143" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">HTTPS to the console</text>
<rect x="330" y="96" width="300" height="64" rx="10" fill="#1E322C" stroke="#3D5A53" stroke-width="1.5"/>
<text x="346" y="122" font-size="15" font-weight="650" fill="#F6ECDC" text-anchor="start">Cloudflare Access + Tunnel</text>
<text x="346" y="143" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">SSO or email one-time PIN</text>
<rect x="40" y="250" width="220" height="72" rx="10" fill="#1E322C" stroke="#3D5A53" stroke-width="1.5"/>
<text x="56" y="276" font-size="15" font-weight="650" fill="#F6ECDC" text-anchor="start">Ziti clients</text>
<text x="56" y="297" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">Phones, laptops, workloads</text>
<rect x="40" y="370" width="220" height="72" rx="10" fill="#1E322C" stroke="#3D5A53" stroke-width="1.5"/>
<text x="56" y="396" font-size="15" font-weight="650" fill="#F6ECDC" text-anchor="start">You</text>
<text x="56" y="417" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">Operator workstation</text>
<rect x="330" y="190" width="646" height="306" rx="14" fill="#15241F" stroke="#2A3F39" stroke-width="1.5"/>
<text x="350" y="216" font-size="11.5" font-weight="700" fill="#A8B8B2" text-anchor="start" letter-spacing="0.08em">ORACLE CLOUD · VCN</text>
<rect x="356" y="232" width="210" height="236" rx="10" fill="#1E322C" stroke="#3D5A53" stroke-width="1.5"/>
<text x="372" y="258" font-size="15" font-weight="650" fill="#F6ECDC" text-anchor="start">Security list</text>
<text x="372" y="279" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">22/tcp ← your IP /32</text>
<text x="372" y="297" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">1280/tcp ← anywhere</text>
<text x="372" y="315" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">8444/tcp ← anywhere</text>
<text x="372" y="333" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">ICMP (path MTU)</text>
<text x="372" y="351" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">Everything else denied</text>
<rect x="600" y="232" width="352" height="236" rx="10" fill="#2A211B" stroke="#9A4A2C" stroke-width="1.5"/>
<text x="616" y="258" font-size="15" font-weight="650" fill="#F6ECDC" text-anchor="start">Linux instance</text>
<text x="616" y="279" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">Ubuntu or Oracle Linux · reserved public IP</text>
<text x="616" y="297" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start"></text>
<text x="616" y="315" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">deploy-ziti.sh installs:</text>
<text x="616" y="333" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">· host firewall (ufw / firewalld)</text>
<text x="616" y="351" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">· Docker or Podman</text>
<text x="616" y="369" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">· OpenZiti controller, router, console</text>
<text x="616" y="387" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">· cloudflared</text>
<path d="M280 128 L330 128" fill="none" stroke="#9FC2B8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-http)"/>
<path d="M790 232 L790 128 L630 128" fill="none" stroke="#9FC2B8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-http)" marker-start="url(#arr-http)"/>
<rect x="733.5" y="161" width="113" height="20" rx="10" fill="#0F1A18" stroke="#9FC2B8" stroke-width="1"/>
<text x="790" y="175.5" font-size="11.5" font-weight="600" fill="#9FC2B8" text-anchor="middle">outbound tunnel</text>
<path d="M260 286 L356 286" fill="none" stroke="#FF7A4D" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-overlay)"/>
<rect x="264.5" y="275" width="87" height="20" rx="10" fill="#0F1A18" stroke="#FF7A4D" stroke-width="1"/>
<text x="308" y="289.5" font-size="11.5" font-weight="600" fill="#FF7A4D" text-anchor="middle">1280 / 8444</text>
<path d="M566 286 L600 286" fill="none" stroke="#FF7A4D" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-overlay)"/>
<path d="M260 406 L356 406" fill="none" stroke="#9FC2B8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-http)"/>
<rect x="281.0" y="395" width="54" height="20" rx="10" fill="#0F1A18" stroke="#9FC2B8" stroke-width="1"/>
<text x="308" y="409.5" font-size="11.5" font-weight="600" fill="#9FC2B8" text-anchor="middle">SSH 22</text>
<path d="M566 406 L600 406" fill="none" stroke="#9FC2B8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-http)"/>
</svg>
