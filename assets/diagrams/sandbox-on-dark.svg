<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Configuration 1: all-local containerized sandbox</title>
<desc id="d">A browser and the OpenZiti Desktop Edge client on the workstation reach containers over 127.0.0.1. The menu nginx container serves the portal and Admin Console and proxies to the app and controller. zt-app binds a dark service through the controller&#x27;s edge router; ziti-setup provisions services, policies and identities.</desc>
<defs>
<marker id="arr-http" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9FC2B8"/></marker>
<marker id="arr-overlay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF7A4D"/></marker>
</defs>
<rect width="960" height="640" rx="14" fill="#0F1A18"/>
<text x="32" y="42" font-size="19" font-weight="700" fill="#F6ECDC" text-anchor="start">Configuration 1 · All-local sandbox</text>
<text x="32" y="63" font-size="12.5" font-weight="400" fill="#A8B8B2" text-anchor="start">Everything runs in local containers. Every published port is bound to 127.0.0.1.</text>
