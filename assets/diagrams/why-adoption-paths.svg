<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Two Easy Ways to Adopt OpenZiti</title>
<desc id="d">Organizations can start today with zero code changes using drop-in OpenZiti tunnelers, and later embed the OpenZiti SDK directly inside critical applications for the strongest application-level zero trust.</desc>
<defs>
<marker id="arr-http" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#3E5A54"/></marker>
<marker id="arr-overlay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#D9481C"/></marker>
<marker id="arr-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#1E6B52"/></marker>
<marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#B83227"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#5E6E69"/></marker>
</defs>
<rect width="1040" height="460" rx="16" fill="#FFFDF9"/>
<text x="36" y="44" font-size="20" font-weight="750" fill="#14302B" text-anchor="start">Adopt at Your Own Pace — No &quot;Big Bang&quot; Rewrite</text>
<text x="36" y="67" font-size="13" font-weight="400" fill="#5E6E69" text-anchor="start">Start protecting existing apps in minutes, then embed zero trust directly into new software.</text>
<rect x="28" y="96" width="476" height="332" rx="14" fill="#F6ECDC" stroke="#E3D3B8" stroke-width="1.5"/>
<text x="46" y="122" font-size="11.5" font-weight="700" fill="#14302B" text-anchor="start" letter-spacing="0.08em">STEP 1 · START TODAY (ZERO CODE CHANGES)</text>
<rect x="76.0" y="135" width="136" height="22" rx="11" fill="#FBE3A6"/>
<text x="144" y="150" font-size="11.5" font-weight="650" fill="#14302B" text-anchor="middle">Drop-In Tunnelers</text>
<rect x="52" y="174" width="180" height="96" rx="10" fill="#E8F5EF" stroke="#8CC8B0" stroke-width="1.5"/>
<text x="68" y="200" font-size="14.5" font-weight="700" fill="#1E6B52" text-anchor="start">User Device</text>
<text x="68" y="220" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">OpenZiti Desktop</text>
<text x="68" y="237" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">or Mobile Edge app</text>
<text x="68" y="254" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">(just like a normal app)</text>
<rect x="298" y="174" width="182" height="96" rx="10" fill="#FFF4E8" stroke="#E9A27F" stroke-width="1.5"/>
<text x="314" y="200" font-size="14.5" font-weight="700" fill="#14302B" text-anchor="start">Existing Server</text>
<text x="314" y="220" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Lightweight tunneler</text>
<text x="314" y="237" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">sits next to your app</text>
<text x="314" y="254" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">No code changes</text>
<path d="M232 222 L298 222" fill="none" stroke="#D9481C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-overlay)"/>
<rect x="52" y="294" width="428" height="110" rx="10" fill="#FFFFFF" stroke="#CDBFA6" stroke-width="1.5"/>
<text x="68" y="320" font-size="13.5" font-weight="700" fill="#14302B" text-anchor="start">Best for Immediate Wins</text>
<text x="68" y="340" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">• Legacy web apps, databases, SSH, RDP, and internal dashboards</text>
<text x="68" y="357" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">• Turn off public inbound ports and retire legacy VPNs right away</text>
<text x="68" y="374" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">• Works across AWS, Azure, OCI, on-prem, and home labs</text>
<path d="M504 260 L536 260" fill="none" stroke="#D9481C" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-overlay)"/>
<rect x="536" y="96" width="476" height="332" rx="14" fill="#E8F5EF" stroke="#8CC8B0" stroke-width="1.5"/>
<text x="554" y="122" font-size="11.5" font-weight="700" fill="#1E6B52" text-anchor="start" letter-spacing="0.08em">STEP 2 · GO FURTHER (EMBEDDED IN YOUR APP)</text>
<rect x="578.5" y="135" width="183" height="22" rx="11" fill="#FFFFFF" stroke="#8CC8B0" stroke-width="1.2"/>
<text x="670" y="150" font-size="11.5" font-weight="650" fill="#1E6B52" text-anchor="middle">OpenZiti SDK Inside Code</text>
<rect x="560" y="174" width="180" height="96" rx="10" fill="#E8F5EF" stroke="#8CC8B0" stroke-width="1.5"/>
<text x="576" y="200" font-size="14.5" font-weight="700" fill="#1E6B52" text-anchor="start">User or Service</text>
<text x="576" y="220" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Browser, mobile app,</text>
<text x="576" y="237" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">or microservice with</text>
<text x="576" y="254" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">OpenZiti identity</text>
<rect x="806" y="174" width="182" height="96" rx="10" fill="#E8F5EF" stroke="#8CC8B0" stroke-width="1.5"/>
<text x="822" y="200" font-size="14.5" font-weight="700" fill="#1E6B52" text-anchor="start">Zero-Trust App</text>
<text x="822" y="220" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">OpenZiti SDK built in</text>
<text x="822" y="237" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">(Java, Go, Python, C...)</text>
<text x="822" y="254" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Zero open local ports</text>
<path d="M740 222 L806 222" fill="none" stroke="#D9481C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-overlay)"/>
<rect x="560" y="294" width="428" height="110" rx="10" fill="#FFFFFF" stroke="#CDBFA6" stroke-width="1.5"/>
<text x="576" y="320" font-size="13.5" font-weight="700" fill="#14302B" text-anchor="start">Best for Crown-Jewel &amp; New Apps</text>
<text x="576" y="340" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">• The app itself is dark — not even a local port on the server</text>
<text x="576" y="357" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">• App-to-app encryption from the code inside one app to the next</text>
<text x="576" y="374" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">• See it live in Baked Pasta&#x27;s zt-app Spring Boot demo!</text>
</svg>
