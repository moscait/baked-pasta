<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Traditional Network vs. OpenZiti Zero Trust</title>
<desc id="d">Side-by-side comparison showing how a traditional network exposes open doors to the internet and allows intruders to roam inside, while OpenZiti has no open doors and grants private per-app paths only after verifying identity.</desc>
<defs>
<marker id="arr-http" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#3E5A54"/></marker>
<marker id="arr-overlay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#D9481C"/></marker>
<marker id="arr-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#1E6B52"/></marker>
<marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#B83227"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#5E6E69"/></marker>
</defs>
<rect width="1040" height="560" rx="16" fill="#FFFDF9"/>
<text x="36" y="44" font-size="20" font-weight="750" fill="#14302B" text-anchor="start">The Old Castle-and-Moat vs. OpenZiti Zero Trust</text>
<text x="36" y="67" font-size="13" font-weight="400" fill="#5E6E69" text-anchor="start">Stop defending a network perimeter that anyone on the internet can knock on.</text>
<rect x="28" y="92" width="480" height="440" rx="14" fill="#FDECEB" stroke="#E6A19B" stroke-width="1.5"/>
<text x="46" y="118" font-size="11.5" font-weight="700" fill="#B83227" text-anchor="start" letter-spacing="0.08em">TRADITIONAL NETWORK / VPN (CASTLE &amp; MOAT)</text>
<rect x="52" y="134" width="155" height="68" rx="10" fill="#FDECEB" stroke="#E6A19B" stroke-width="1.5"/>
<text x="68" y="160" font-size="14.5" font-weight="700" fill="#B83227" text-anchor="start">Bots &amp; Attackers</text>
<text x="68" y="180" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Scan open ports</text>
<text x="68" y="197" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">24/7 from internet</text>
<rect x="248" y="134" width="236" height="68" rx="10" fill="#FFF6DC" stroke="#E4C46B" stroke-width="1.5"/>
<text x="264" y="160" font-size="14.5" font-weight="700" fill="#14302B" text-anchor="start">Open Front Doors</text>
<text x="264" y="180" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Public IP · VPN · SSH · Web</text>
<text x="264" y="197" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Firewall rules to maintain</text>
<path d="M207 168 L248 168" fill="none" stroke="#B83227" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-bad)"/>
<rect x="52" y="232" width="432" height="210" rx="14" fill="#FFFFFF" stroke="#E6A19B" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="156" y="258" font-size="11.5" font-weight="700" fill="#B83227" text-anchor="start" letter-spacing="0.08em">INSIDE THE NETWORK — FLAT ACCESS</text>
<rect x="72" y="272" width="120" height="62" rx="10" fill="#FFFFFF" stroke="#CDBFA6" stroke-width="1.5"/>
<text x="132.0" y="298" font-size="14.5" font-weight="700" fill="#14302B" text-anchor="middle">CRM App</text>
<text x="132.0" y="318" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="middle">Sales tool</text>
<rect x="208" y="272" width="120" height="62" rx="10" fill="#FFFFFF" stroke="#CDBFA6" stroke-width="1.5"/>
<text x="268.0" y="298" font-size="14.5" font-weight="700" fill="#14302B" text-anchor="middle">Payroll DB</text>
<text x="268.0" y="318" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="middle">Sensitive HR</text>
<rect x="344" y="272" width="120" height="62" rx="10" fill="#FFFFFF" stroke="#CDBFA6" stroke-width="1.5"/>
<text x="404.0" y="298" font-size="14.5" font-weight="700" fill="#14302B" text-anchor="middle">Prod Servers</text>
<text x="404.0" y="318" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="middle">Core infra</text>
<path d="M340 202 L340 220 L112 220 L112 272" fill="none" stroke="#B83227" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arr-bad)"/>
<path d="M192 303 L208 303" fill="none" stroke="#B83227" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-bad)" marker-start="url(#arr-bad)"/>
<path d="M328 303 L344 303" fill="none" stroke="#B83227" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-bad)" marker-start="url(#arr-bad)"/>
<rect x="67.5" y="361" width="401" height="22" rx="11" fill="#FDECEB" stroke="#E6A19B" stroke-width="1.2"/>
<text x="268" y="376" font-size="11.5" font-weight="650" fill="#B83227" text-anchor="middle">One stolen password = attacker roams the entire building</text>
<text x="268" y="418" font-size="12" font-weight="600" fill="#B83227" text-anchor="middle">Exposed to DDoS, port scanning, and lateral movement</text>
<rect x="88.0" y="477" width="360" height="22" rx="11" fill="#FFFFFF" stroke="#E6A19B" stroke-width="1.2"/>
<text x="268" y="492" font-size="11.5" font-weight="650" fill="#B83227" text-anchor="middle">Trusts location (&quot;you&#x27;re inside the office / VPN&quot;)</text>
<rect x="532" y="92" width="480" height="440" rx="14" fill="#E8F5EF" stroke="#8CC8B0" stroke-width="1.5"/>
<text x="550" y="118" font-size="11.5" font-weight="700" fill="#1E6B52" text-anchor="start" letter-spacing="0.08em">OPENZITI ZERO TRUST (INVISIBLE BY DEFAULT)</text>
<rect x="556" y="134" width="155" height="68" rx="10" fill="#FFFFFF" stroke="#CDBFA6" stroke-width="1.5"/>
<text x="572" y="160" font-size="14.5" font-weight="700" fill="#14302B" text-anchor="start">Bots &amp; Attackers</text>
<text x="572" y="180" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Scan public IP...</text>
<text x="572" y="197" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Nothing answers!</text>
<rect x="752" y="134" width="236" height="68" rx="10" fill="#E8F5EF" stroke="#8CC8B0" stroke-width="1.5"/>
<text x="768" y="160" font-size="14.5" font-weight="700" fill="#1E6B52" text-anchor="start">Verified Identity</text>
<text x="768" y="180" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Strong device + user key</text>
<text x="768" y="197" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Checked before connecting</text>
<path d="M633 202 L633 240" fill="none" stroke="#5E6E69" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arr-muted)"/>
<circle cx="633" cy="244" r="12" fill="#FDECEB" stroke="#B83227" stroke-width="1.8"/>
<path d="M627.6 238.6 L638.4 249.4 M638.4 238.6 L627.6 249.4" stroke="#B83227" stroke-width="2" stroke-linecap="round"/>
<text x="633" y="274" font-size="11.5" font-weight="700" fill="#B83227" text-anchor="middle">No open app ports</text>
<text x="633" y="290" font-size="11" font-weight="400" fill="#5E6E69" text-anchor="middle">Servers stay invisible</text>
<rect x="556" y="326" width="432" height="116" rx="14" fill="#FFFFFF" stroke="#8CC8B0" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="674" y="352" font-size="11.5" font-weight="700" fill="#1E6B52" text-anchor="start" letter-spacing="0.08em">YOUR APPS — NO OPEN INBOUND PORTS</text>
<rect x="576" y="362" width="120" height="62" rx="10" fill="#E8F5EF" stroke="#8CC8B0" stroke-width="1.5"/>
<text x="636.0" y="388" font-size="14.5" font-weight="700" fill="#1E6B52" text-anchor="middle">CRM App</text>
<text x="636.0" y="408" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="middle">Allowed</text>
<rect x="712" y="362" width="120" height="62" rx="10" fill="#FFFFFF" stroke="#CDBFA6" stroke-width="1.5"/>
<text x="772.0" y="388" font-size="14.5" font-weight="700" fill="#14302B" text-anchor="middle">Payroll DB</text>
<text x="772.0" y="408" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="middle">Hidden</text>
<rect x="848" y="362" width="120" height="62" rx="10" fill="#FFFFFF" stroke="#CDBFA6" stroke-width="1.5"/>
<text x="908.0" y="388" font-size="14.5" font-weight="700" fill="#14302B" text-anchor="middle">Prod Servers</text>
<text x="908.0" y="408" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="middle">Hidden</text>
<path d="M870 202 L870 308 L612 308 L612 362" fill="none" stroke="#D9481C" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-overlay)"/>
<rect x="753.0" y="245" width="204" height="22" rx="11" fill="#FFF4E8" stroke="#E9A27F" stroke-width="1.2"/>
<text x="855" y="260" font-size="11.5" font-weight="650" fill="#D9481C" text-anchor="middle">Encrypted tunnel (CRM only)</text>
<rect x="595.5" y="477" width="353" height="22" rx="11" fill="#FFFFFF" stroke="#8CC8B0" stroke-width="1.2"/>
<text x="772" y="492" font-size="11.5" font-weight="650" fill="#1E6B52" text-anchor="middle">Trusts verified identity + least-privilege policy</text>
</svg>
