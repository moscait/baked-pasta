<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How Dark Services Stay Invisible with Outbound-Only Connections</title>
<desc id="d">Your application never opens an inbound firewall port. Both the authorized user and the protected server dial outbound into the OpenZiti overlay, which stitches a private end-to-end encrypted connection between them.</desc>
<defs>
<marker id="arr-http" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#3E5A54"/></marker>
<marker id="arr-overlay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#D9481C"/></marker>
<marker id="arr-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#1E6B52"/></marker>
<marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#B83227"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#5E6E69"/></marker>
</defs>
<rect width="1040" height="480" rx="16" fill="#FFFDF9"/>
<text x="36" y="44" font-size="20" font-weight="750" fill="#14302B" text-anchor="start">How &quot;Dark&quot; Services Stay Invisible</text>
<text x="36" y="67" font-size="13" font-weight="400" fill="#5E6E69" text-anchor="start">Your servers never open a public door. Both sides dial out to meet in the middle.</text>
<rect x="36" y="114" width="238" height="108" rx="10" fill="#E8F5EF" stroke="#8CC8B0" stroke-width="1.5"/>
<text x="52" y="140" font-size="14.5" font-weight="700" fill="#1E6B52" text-anchor="start">Authorized Employee</text>
<text x="52" y="160" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Laptop or phone with</text>
<text x="52" y="177" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">verified OpenZiti identity</text>
<text x="52" y="194" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">(cryptographic key, not just a password)</text>
<rect x="36" y="304" width="238" height="104" rx="10" fill="#FDECEB" stroke="#E6A19B" stroke-width="1.5"/>
<text x="52" y="330" font-size="14.5" font-weight="700" fill="#B83227" text-anchor="start">Internet Scanner / Attacker</text>
<text x="52" y="350" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Knocks on your server&#x27;s IP</text>
<text x="52" y="367" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Looking for open ports</text>
<text x="52" y="384" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">to attack or exploit</text>
<rect x="366" y="106" width="292" height="198" rx="14" fill="#FFF4E8" stroke="#E9A27F" stroke-width="1.5"/>
<text x="384" y="132" font-size="11.5" font-weight="700" fill="#D9481C" text-anchor="start" letter-spacing="0.08em">OPENZITI OVERLAY (HARDENED ENTRY)</text>
<rect x="390" y="146" width="244" height="62" rx="10" fill="#FFFFFF" stroke="#CDBFA6" stroke-width="1.5"/>
<text x="512.0" y="172" font-size="14.5" font-weight="700" fill="#14302B" text-anchor="middle">1. Checks Identity &amp; Policy</text>
<text x="512.0" y="192" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="middle">Only verified devices get past the door</text>
<rect x="390" y="224" width="244" height="62" rx="10" fill="#FFFFFF" stroke="#CDBFA6" stroke-width="1.5"/>
<text x="512.0" y="250" font-size="14.5" font-weight="700" fill="#14302B" text-anchor="middle">2. Stitches Encrypted Tunnel</text>
<text x="512.0" y="270" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="middle">End-to-end encrypted; zero trust</text>
<rect x="746" y="106" width="260" height="316" rx="14" fill="#F6ECDC" stroke="#E3D3B8" stroke-width="1.5"/>
<text x="764" y="132" font-size="11.5" font-weight="700" fill="#5E6E69" text-anchor="start" letter-spacing="0.08em">YOUR PRIVATE SERVER / CLOUD</text>
<rect x="767.5" y="141" width="217" height="22" rx="11" fill="#E8F5EF" stroke="#8CC8B0" stroke-width="1.2"/>
<text x="876" y="156" font-size="11.5" font-weight="650" fill="#1E6B52" text-anchor="middle">Firewall: ALL INBOUND BLOCKED</text>
<rect x="770" y="182" width="212" height="92" rx="10" fill="#FFF4E8" stroke="#E9A27F" stroke-width="1.5"/>
<text x="786" y="208" font-size="14.5" font-weight="700" fill="#14302B" text-anchor="start">Your App / Database</text>
<text x="786" y="228" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">No public IP required</text>
<text x="786" y="245" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">No open listening port</text>
<text x="786" y="262" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Dials OUTBOUND only</text>
<rect x="770" y="300" width="212" height="96" rx="10" fill="#FFFFFF" stroke="#CDBFA6" stroke-width="1.5"/>
<text x="786" y="326" font-size="14.5" font-weight="700" fill="#14302B" text-anchor="start">To the Public Internet:</text>
<text x="786" y="346" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Looks completely empty.</text>
<text x="786" y="363" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Zero ports respond.</text>
<text x="786" y="380" font-size="12" font-weight="400" fill="#5E6E69" text-anchor="start">Nothing to scan or DDoS.</text>
<path d="M274 168 L366 168" fill="none" stroke="#D9481C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-overlay)"/>
<rect x="279.5" y="133" width="81" height="22" rx="11" fill="#FFFDF9" stroke="#D9481C" stroke-width="1.2"/>
<text x="320" y="148" font-size="11" font-weight="650" fill="#D9481C" text-anchor="middle">Dials out</text>
<path d="M770 228 L658 228" fill="none" stroke="#D9481C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-overlay)"/>
<rect x="673.5" y="193" width="81" height="22" rx="11" fill="#FFFDF9" stroke="#D9481C" stroke-width="1.2"/>
<text x="714" y="208" font-size="11" font-weight="650" fill="#D9481C" text-anchor="middle">Dials out</text>
<rect x="298.0" y="325" width="428" height="22" rx="11" fill="#E8F5EF" stroke="#8CC8B0" stroke-width="1.2"/>
<text x="512" y="340" font-size="11.5" font-weight="650" fill="#1E6B52" text-anchor="middle">End-to-end encrypted: even the network cannot read your data</text>
<path d="M274 356 L722 356" fill="none" stroke="#B83227" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arr-bad)"/>
<circle cx="736" cy="356" r="13" fill="#FDECEB" stroke="#B83227" stroke-width="1.8"/>
<path d="M730.15 350.15 L741.85 361.85 M741.85 350.15 L730.15 361.85" stroke="#B83227" stroke-width="2" stroke-linecap="round"/>
<rect x="322.0" y="373" width="380" height="22" rx="11" fill="#FDECEB" stroke="#E6A19B" stroke-width="1.2"/>
<text x="512" y="388" font-size="11.5" font-weight="650" fill="#B83227" text-anchor="middle">Blocked at firewall — no open port exists to knock on</text>
<text x="520" y="452" font-size="12.5" font-weight="600" fill="#5E6E69" text-anchor="middle">Analogy: Instead of posting your home address and leaving a lock on the door, you meet verified friends at a private club.</text>
</svg>
