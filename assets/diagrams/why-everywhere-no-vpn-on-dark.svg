<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Traditional VPN Hairpin vs. OpenZiti Direct Mesh</title>
<desc id="d">A traditional VPN forces all remote traffic through one central office gateway, creating lag and disconnects. OpenZiti routes each user directly to the nearest overlay router and straight to any cloud or office resource.</desc>
<defs>
<marker id="arr-http" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#9FC2B8"/></marker>
<marker id="arr-overlay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#FF7A4D"/></marker>
<marker id="arr-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#5FD3A8"/></marker>
<marker id="arr-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#FF7E75"/></marker>
<marker id="arr-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#A8B8B2"/></marker>
</defs>
<rect width="1040" height="500" rx="16" fill="#0F1A18"/>
<text x="36" y="44" font-size="20" font-weight="750" fill="#F6ECDC" text-anchor="start">Works Anywhere — Without the VPN Bottleneck</text>
<text x="36" y="67" font-size="13" font-weight="400" fill="#A8B8B2" text-anchor="start">No more &quot;please connect to the VPN&quot;, dropped video calls, or slow central gateways.</text>
<rect x="28" y="94" width="984" height="172" rx="14" fill="#331A19" stroke="#8E3B35" stroke-width="1.5"/>
<text x="46" y="120" font-size="11.5" font-weight="700" fill="#FF7E75" text-anchor="start" letter-spacing="0.08em">TRADITIONAL VPN: EVERY REQUEST DETOURS THROUGH ONE CHOKE POINT</text>
<rect x="52" y="136" width="200" height="102" rx="10" fill="#1E322C" stroke="#3D5A53" stroke-width="1.5"/>
<text x="68" y="162" font-size="14.5" font-weight="700" fill="#F6ECDC" text-anchor="start">Remote Worker</text>
<text x="68" y="182" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Home, hotel, or coffee shop</text>
<text x="68" y="199" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Manual VPN login</text>
<text x="68" y="216" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Drops on Wi-Fi switch</text>
<rect x="390" y="136" width="240" height="102" rx="10" fill="#331A19" stroke="#8E3B35" stroke-width="1.5"/>
<text x="406" y="162" font-size="14.5" font-weight="700" fill="#FF7E75" text-anchor="start">Office VPN Gateway</text>
<text x="406" y="182" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Single bottleneck &amp; target</text>
<text x="406" y="199" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Slow hairpin routing</text>
<text x="406" y="216" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Overloaded at peak hours</text>
<rect x="772" y="136" width="216" height="102" rx="10" fill="#1E322C" stroke="#3D5A53" stroke-width="1.5"/>
<text x="788" y="162" font-size="14.5" font-weight="700" fill="#F6ECDC" text-anchor="start">Cloud App (AWS / OCI)</text>
<text x="788" y="182" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Traffic goes to office first,</text>
<text x="788" y="199" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">then out to the cloud,</text>
<text x="788" y="216" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">then back again!</text>
<path d="M252 187 L390 187" fill="none" stroke="#FF7E75" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-bad)" marker-start="url(#arr-bad)"/>
<rect x="273.5" y="154" width="95" height="22" rx="11" fill="#0F1A18" stroke="#FF7E75" stroke-width="1.2"/>
<text x="321" y="169" font-size="11" font-weight="650" fill="#FF7E75" text-anchor="middle">Slow detour</text>
<path d="M630 187 L772 187" fill="none" stroke="#FF7E75" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-bad)" marker-start="url(#arr-bad)"/>
<rect x="653.5" y="154" width="95" height="22" rx="11" fill="#0F1A18" stroke="#FF7E75" stroke-width="1.2"/>
<text x="701" y="169" font-size="11" font-weight="650" fill="#FF7E75" text-anchor="middle">Hairpin hop</text>
<rect x="28" y="290" width="984" height="184" rx="14" fill="#143026" stroke="#2E755C" stroke-width="1.5"/>
<text x="46" y="316" font-size="11.5" font-weight="700" fill="#5FD3A8" text-anchor="start" letter-spacing="0.08em">OPENZITI: ALWAYS-ON, FASTEST PATH TO EVERY CLOUD &amp; OFFICE</text>
<rect x="52" y="338" width="200" height="110" rx="10" fill="#143026" stroke="#2E755C" stroke-width="1.5"/>
<text x="68" y="364" font-size="14.5" font-weight="700" fill="#5FD3A8" text-anchor="start">Remote Worker</text>
<text x="68" y="384" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Always-on in background</text>
<text x="68" y="401" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Zero VPN popups</text>
<text x="68" y="418" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Survives Wi-Fi ↔ 5G</text>
<rect x="366" y="338" width="224" height="110" rx="10" fill="#2A211B" stroke="#9A4A2C" stroke-width="1.5"/>
<text x="382" y="364" font-size="14.5" font-weight="700" fill="#F6ECDC" text-anchor="start">OpenZiti Mesh</text>
<text x="382" y="384" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Smartest, fastest route</text>
<text x="382" y="401" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Multi-cloud &amp; on-prem</text>
<text x="382" y="418" font-size="12" font-weight="400" fill="#A8B8B2" text-anchor="start">Self-healing paths</text>
<rect x="714" y="326" width="274" height="42" rx="10" fill="#1E322C" stroke="#3D5A53" stroke-width="1.5"/>
<text x="730" y="352" font-size="13" font-weight="700" fill="#F6ECDC" text-anchor="start">Cloud Apps (AWS / Azure / OCI)</text>
<rect x="714" y="376" width="274" height="42" rx="10" fill="#1E322C" stroke="#3D5A53" stroke-width="1.5"/>
<text x="730" y="402" font-size="13" font-weight="700" fill="#F6ECDC" text-anchor="start">Office &amp; On-Prem Servers</text>
<rect x="714" y="426" width="274" height="42" rx="10" fill="#1E322C" stroke="#3D5A53" stroke-width="1.5"/>
<text x="730" y="452" font-size="13" font-weight="700" fill="#F6ECDC" text-anchor="start">Home Lab / Edge Devices</text>
<path d="M252 393 L366 393" fill="none" stroke="#FF7A4D" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-overlay)" marker-start="url(#arr-overlay)"/>
<rect x="277.0" y="359" width="64" height="22" rx="11" fill="#0F1A18" stroke="#FF7A4D" stroke-width="1.2"/>
<text x="309" y="374" font-size="11" font-weight="650" fill="#FF7A4D" text-anchor="middle">Direct</text>
<path d="M590 368 L714 347" fill="none" stroke="#FF7A4D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-overlay)"/>
<path d="M590 393 L714 397" fill="none" stroke="#FF7A4D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-overlay)"/>
<path d="M590 418 L714 447" fill="none" stroke="#FF7A4D" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr-overlay)"/>
</svg>
