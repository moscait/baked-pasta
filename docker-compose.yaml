# Local developer sandbox.
# SECURITY:
# - Every container runs as an explicit non-root UID/GID with `no-new-privileges:true`.
# - Zero containers mount `/var/run/docker.sock`.
# - Every published port binds to 127.0.0.1 by default (override with SANDBOX_BIND_ADDR).
# - The admin password is read from .env (created automatically by `make sandbox-up`).

volumes:
  ziti-pki-data:        # Persists OpenZiti's CA certificates and database (owned by uid 2171)
  ziti-sandbox-runtime: # Shared non-root runtime volume for generated certs, tokens, log & heartbeat

services:
  dns-server:
    image: docker.io/defreitas/dns-proxy-server:5.9.0@sha256:517e6b76ba9e124068bdf4f0ed8cfa7eaa8dacda33b84bc627cc05ced4c9998a
    container_name: dns-server
    # Runs rootless as nobody (65534:65534) with only CAP_NET_BIND_SERVICE for port 53.
    # Docker's embedded DNS (127.0.0.11) already resolves container names on the compose network,
    # and the host uses /etc/hosts — so /var/run/docker.sock is not mounted.
    user: "65534:65534"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SANDBOX_BIND_ADDR:-127.0.0.1}:5300:53/udp"
    environment:
      - MG_REGISTER_CONTAINER_NAMES=false
      - MG_DEFAULT_DNS=false
    restart: always

  ziti-controller:
    image: docker.io/openziti/quickstart:2.0.8@sha256:a73d81b46a526a46a677f9f3ee8c2a31c6672935357b08312e99adda94e02bd3
    container_name: ziti-controller.local
    user: "2171:2171"
    security_opt:
      - no-new-privileges:true
    environment:
      - MG_HOSTNAMES=ziti-controller.local
      - ZITI_USER=admin
      - ZITI_PWD=${OPENZITI_ADMIN_PASSWORD:?OPENZITI_ADMIN_PASSWORD is not set - run 'make sandbox-up' to generate .env}
    volumes:
      - ziti-pki-data:/persistent
    ports:
      - "${SANDBOX_BIND_ADDR:-127.0.0.1}:1280:1280" # Edge Controller API
      - "${SANDBOX_BIND_ADDR:-127.0.0.1}:8444:8444" # Edge Router listener
    entrypoint:
      - bash
      - -c
      - |
        # OpenZiti 2.x keeps its config in /persistent/instance-1/; a 1.x volume has ctrl.yaml at the top.
        if [ -f /persistent/ctrl.yaml ] && [ ! -d /persistent/instance-1 ]; then
          echo "ERROR: this volume holds an OpenZiti 1.x controller. Run 'docker compose down -v' and start again." >&2
          exit 1
        fi
        QuickstartCmd=(/var/openziti/ziti-bin/ziti edge quickstart --home /persistent --instance-id instance-1
          --ctrl-address ziti-controller.local --router-address ziti-controller.local --router-port 8444
          --username "$$ZITI_USER")
        # quickstart takes the admin password only as an argument (visible via ps). It is needed only
        # to create the admin user on first boot; an initialized controller starts without it.
        if [ -f /persistent/instance-1/router-instance-1.cert ]; then
          exec "$${QuickstartCmd[@]}"
        fi
        exec "$${QuickstartCmd[@]}" --password "$$ZITI_PWD"
    depends_on:
      - dns-server

  ziti-setup:
    image: docker.io/openziti/quickstart:2.0.8@sha256:a73d81b46a526a46a677f9f3ee8c2a31c6672935357b08312e99adda94e02bd3
    container_name: ziti-setup
    # Runs rootless as the ziti user (uid 2171) with primary gid 101 (nginx) and supplementary gid 2171.
    # Because /persistent in openziti/quickstart is pre-owned by uid 2171, Docker initializes the
    # ziti-sandbox-runtime volume owned by 2171 without ever needing a root container.
    user: "2171:101"
    group_add:
      - "2171"
    security_opt:
      - no-new-privileges:true
    environment:
      - ZITI_USER=admin
      - ZITI_PWD=${OPENZITI_ADMIN_PASSWORD:?OPENZITI_ADMIN_PASSWORD is not set - run 'make sandbox-up' to generate .env}
      - CONSOLE_TYPE=${BAKED_PASTA_CONSOLE:-zac}
    volumes:
      - ziti-sandbox-runtime:/persistent
      - ./menu/zac:/workspace/menu/zac:ro
    entrypoint:
      - bash
      - -c
      - |
        set -o pipefail

        mkdir -p /persistent/config /persistent/status
        chmod 755 /persistent/config
        # Allow non-root zt-app (uid 1001) to write its liveness heartbeat into /persistent/status
        chmod 1777 /persistent/status

        # Immediately generate self-signed certificate for zt.local to be used by Nginx proxy
        if [ ! -f /persistent/config/zt.local.crt ]; then
          echo "Generating self-signed certificate for zt.local..."
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /persistent/config/zt.local.key \
            -out /persistent/config/zt.local.crt \
            -subj "/CN=zt.local"
        fi
        # Primary gid is 101 (nginx): mode 0640 grants read access ONLY to uid 2171 and gid 101 (menu)
        chmod 640 /persistent/config/zt.local.key
        chmod 644 /persistent/config/zt.local.crt

        setup_ziti() {
          echo "Waiting for OpenZiti controller to start..."
          until curl -k -s https://ziti-controller.local:1280/edge/v1/version > /dev/null; do
            sleep 2
          done
          echo "Controller is up! Logging in..."
          # On OpenZiti 2.x the API answers before quickstart has created the admin user, so retry.
          until /var/openziti/ziti-bin/ziti edge login https://ziti-controller.local:1280 -u "$$ZITI_USER" -p "$$ZITI_PWD" -y; do
            sleep 2
          done

          # OpenZiti 2.x runs the controller as a one-member raft cluster; writes fail with
          # CLUSTER_NO_LEADER until it has elected itself leader, shortly after the API is up.
          echo "Waiting for the controller cluster to elect a leader..."
          until /var/openziti/ziti-bin/ziti ops cluster list -j 2>/dev/null | grep -q '"leader":true'; do
            sleep 2
          done

          # Clean up stale configs from previous compose sessions if the DB was reset
          if ! /var/openziti/ziti-bin/ziti edge list configs "name = \"zt-app-intercept\"" --csv | grep -q "zt-app-intercept"; then
            echo "New controller detected. Clearing old config files..."
            rm -f /persistent/config/zt-app-identity.json /persistent/config/zt-app-ca.pem /persistent/config/zt-app-identity.jwt
            rm -f /persistent/config/zt-host-client.json /persistent/config/zt-host-client.jwt
          fi

          # Check if intercept config exists
          echo "Checking intercept config..."
          if ! /var/openziti/ziti-bin/ziti edge list configs "name = \"zt-app-intercept\"" --csv | grep -q "zt-app-intercept"; then
            echo "Creating intercept config..."
            /var/openziti/ziti-bin/ziti edge create config zt-app-intercept intercept.v1 '{"addresses":["zt-app.local","zt-app-local"],"protocols":["tcp"],"portRanges":[{"low":8080,"high":8080}]}'
          else
            echo "Intercept config 'zt-app-intercept' already exists."
          fi

          # Check if the service exists
          echo "Checking zt-app service..."
          if ! /var/openziti/ziti-bin/ziti edge list services "name = \"zt-app-secure-ui\"" --csv | grep -q "zt-app-secure-ui"; then
            echo "Creating zt-app service..."
            /var/openziti/ziti-bin/ziti edge create service zt-app-secure-ui --configs zt-app-intercept
          else
            echo "Service 'zt-app-secure-ui' already exists."
          fi

          # Check if the identity exists
          echo "Checking zt-app identity..."
          if [ ! -f /persistent/config/zt-app-identity.json ]; then
            if /var/openziti/ziti-bin/ziti edge list identities "name = \"zt-app\"" --csv | grep -q "zt-app"; then
              echo "Deleting existing zt-app identity..."
              /var/openziti/ziti-bin/ziti edge delete identity zt-app
            fi
            echo "Creating zt-app identity..."
            /var/openziti/ziti-bin/ziti edge create identity zt-app -o /persistent/config/zt-app-identity.jwt -a zt-app-identities
            echo "Enrolling zt-app identity..."
            /var/openziti/ziti-bin/ziti edge enroll /persistent/config/zt-app-identity.jwt -o /persistent/config/zt-app-identity.json
          else
            echo "Identity 'zt-app' already exists."
          fi

          # Always re-create the host client identity with a fresh JWT enrollment token
          echo "Creating fresh zt-host-client identity..."
          rm -f /persistent/config/zt-host-client.jwt /persistent/config/zt-host-client.json
          if /var/openziti/ziti-bin/ziti edge list identities "name = \"zt-host-client\"" --csv | grep -q "zt-host-client"; then
            /var/openziti/ziti-bin/ziti edge delete identity zt-host-client
          fi
          /var/openziti/ziti-bin/ziti edge create identity zt-host-client -o /persistent/config/zt-host-client.jwt -a zt-host-client-identities

          if [ -f /persistent/config/zt-app-identity.json ]; then
            echo "Extracting CA certificate..."
            jq -r '.id.ca | sub("pem:"; "")' /persistent/config/zt-app-identity.json > /persistent/config/zt-app-ca.pem
            chmod 644 /persistent/config/zt-app-ca.pem
            # Restrict zt-app-identity.json to gid 2171 (zt-app runs with gid 2171; menu gid 101 cannot read it)
            chgrp 2171 /persistent/config/zt-app-identity.json
            chmod 640 /persistent/config/zt-app-identity.json
          fi

          # Restrict host-client JWT to gid 101 (served by menu nginx at /config/zt-host-client.jwt)
          chmod 640 /persistent/config/zt-host-client.jwt 2>/dev/null || true

          # Create policies
          echo "Checking service policy 'zt-app-bind'..."
          if ! /var/openziti/ziti-bin/ziti edge list service-policies "name = \"zt-app-bind\"" --csv | grep -q "zt-app-bind"; then
            echo "Creating service policy 'zt-app-bind'..."
            # Least privilege: only the hosting app identity may Bind (host) the service
            /var/openziti/ziti-bin/ziti edge create service-policy zt-app-bind Bind --service-roles "@zt-app-secure-ui" --identity-roles "#zt-app-identities"
          else
            echo "Service policy 'zt-app-bind' already exists."
          fi

          echo "Checking service policy 'zt-app-dial'..."
          if ! /var/openziti/ziti-bin/ziti edge list service-policies "name = \"zt-app-dial\"" --csv | grep -q "zt-app-dial"; then
            echo "Creating service policy 'zt-app-dial'..."
            # Least privilege: only enrolled host clients may Dial (access) the service
            /var/openziti/ziti-bin/ziti edge create service-policy zt-app-dial Dial --service-roles "@zt-app-secure-ui" --identity-roles "#zt-host-client-identities"
          else
            echo "Service policy 'zt-app-dial' already exists."
          fi

          echo "Checking edge router policy 'app-router-policy'..."
          if ! /var/openziti/ziti-bin/ziti edge list edge-router-policies "name = \"app-router-policy\"" --csv | grep -q "app-router-policy"; then
            echo "Creating edge router policy 'app-router-policy'..."
            /var/openziti/ziti-bin/ziti edge create edge-router-policy app-router-policy --identity-roles "#all" --edge-router-roles "#all"
          else
            echo "Edge router policy 'app-router-policy' already exists."
          fi

          echo "Checking service edge router policy 'app-service-router-policy'..."
          if ! /var/openziti/ziti-bin/ziti edge list service-edge-router-policies "name = \"app-service-router-policy\"" --csv | grep -q "app-service-router-policy"; then
            echo "Creating service edge router policy 'app-service-router-policy'..."
            /var/openziti/ziti-bin/ziti edge create service-edge-router-policy app-service-router-policy --service-roles "#all" --edge-router-roles "#all"
          else
            echo "Service edge router policy 'app-service-router-policy' already exists."
          fi

          # The static Admin Console (ZAC or BPC web) in menu/zac is downloaded and sha256-verified on
          # the host by scripts/fetch-console.sh. The Vaadin edition runs as its own container instead.
          if [ "$$CONSOLE_TYPE" != "bpc-vaadin" ] && [ ! -f /workspace/menu/zac/index.html ]; then
            echo "ERROR: menu/zac/index.html is missing. Run 'make sandbox-up' or 'scripts/fetch-console.sh sandbox'."
            exit 1
          fi

          echo "Ziti network setup complete!"
        }
        touch /persistent/config/ziti-setup.log
        chmod 644 /persistent/config/ziti-setup.log
        setup_ziti 2>&1 | tee /persistent/config/ziti-setup.log
    depends_on:
      - ziti-controller

  app:
    # Published by .github/workflows/docker-publish.yml. If the registry image can't be pulled,
    # compose builds it locally from source (force a rebuild with: docker compose up -d --build).
    image: ghcr.io/moscait/baked-pasta-demo-app:1.0.3
    build: ./app
    container_name: app.local
    user: "100:101"
    security_opt:
      - no-new-privileges:true
    ports:
      - "${SANDBOX_BIND_ADDR:-127.0.0.1}:8082:8080"
    environment:
      - MG_HOSTNAMES=app.local
    depends_on:
      - dns-server

  zt-app:
    # Published by .github/workflows/docker-publish.yml. If the registry image can't be pulled,
    # compose builds it locally from source (force a rebuild with: docker compose up -d --build).
    image: ghcr.io/moscait/baked-pasta-demo-zt-app:1.0.3
    build: ./zt-app
    container_name: zt-app.local
    # Runs rootless as uid 1001 with gid 2171 (so it can read 0640 zt-app-identity.json)
    user: "1001:2171"
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - sh
      - -c
      - |
        # Wait for the identity file to exist and be valid/complete
        echo "Waiting for zt-app-identity.json and zt-app-ca.pem to be created..."
        while [ ! -s /persistent/config/zt-app-identity.json ] || [ ! -s /persistent/config/zt-app-ca.pem ]; do
          sleep 1
        done
        echo "Found identity files!"

        # Import the Ziti CA into a private, writable copy of the JVM truststore
        # (avoids needing root to modify the image's system cacerts)
        cp "$${JAVA_HOME:-/opt/java/openjdk}/lib/security/cacerts" /tmp/cacerts
        chmod 600 /tmp/cacerts
        keytool -importcert -noprompt -alias ziti-ca -file /persistent/config/zt-app-ca.pem -keystore /tmp/cacerts -storepass changeit

        # Run Java app in background and capture its PID
        java -Djavax.net.ssl.trustStore=/tmp/cacerts -Djavax.net.ssl.trustStorePassword=changeit \
          -Dziti.id=/persistent/config/zt-app-identity.json -Dziti.serviceName=zt-app-secure-ui -jar app.jar &
        JAVA_PID=$$!

        # Start heartbeat that checks if the Java process is still alive
        (
          sleep 5
          while kill -0 $$JAVA_PID 2>/dev/null; do
            date +%s > /persistent/status/zt-app-heartbeat.txt 2>/dev/null
            sleep 2
          done
          rm -f /persistent/status/zt-app-heartbeat.txt
        ) &

        # Wait for Java to exit (keeps the container running)
        wait $$JAVA_PID
    environment:
      - MG_HOSTNAMES=zt-app.local
      # Environment variables expected by the Ziti Spring Boot SDK
      - ZITI_CONTROLLER_URL=https://ziti-controller.local:1280
      - ZITI_IDENTITY_FILE=/persistent/config/zt-app-identity.json
      - ZITI_ID=/persistent/config/zt-app-identity.json
      - ZITI_SERVICE_NAME=zt-app-secure-ui
    volumes:
      - ziti-sandbox-runtime:/persistent
    depends_on:
      ziti-controller:
        condition: service_started
      ziti-setup:
        condition: service_completed_successfully

  menu:
    image: docker.io/nginxinc/nginx-unprivileged:1.31.7-alpine3.24@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    container_name: menu.local
    # Runs rootless as the image's unprivileged nginx user (101:101). No Docker socket.
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - sh
      - -c
      - |
        # Wait for SSL certificates to be generated by ziti-setup
        echo "Waiting for SSL certificates to be generated..."
        while [ ! -f /var/zt-runtime/config/zt.local.crt ] || [ ! -f /var/zt-runtime/config/zt.local.key ]; do
          sleep 0.5
        done

        # Detect the system nameserver from /etc/resolv.conf
        NAMESERVER=$$(awk '/nameserver/{print $$2; exit}' /etc/resolv.conf)
        if [ -z "$$NAMESERVER" ]; then
          NAMESERVER="127.0.0.11" # fallback to Docker default
        fi
        echo "Detected nameserver: $$NAMESERVER"

        # Select the nginx template for the active console (static SPA vs. Vaadin backend)
        TEMPLATE=/etc/nginx/default.conf.template
        if [ "$$CONSOLE_TYPE" = "bpc-vaadin" ]; then
          TEMPLATE=/etc/nginx/default.vaadin.conf.template
        fi
        # Replace the placeholder in the template and write to the active configuration
        sed "s/resolver 127.0.0.11/resolver $$NAMESERVER/g" "$$TEMPLATE" > /etc/nginx/conf.d/default.conf

        exec /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - "${SANDBOX_BIND_ADDR:-127.0.0.1}:8080:8080"
      - "${SANDBOX_BIND_ADDR:-127.0.0.1}:8443:8443"
    environment:
      - MG_HOSTNAMES=menu.local
      - CONSOLE_TYPE=${BAKED_PASTA_CONSOLE:-zac}
    volumes:
      - ./menu:/usr/share/nginx/html:ro
      - ./menu/default.conf:/etc/nginx/default.conf.template:ro
      - ./menu/default.vaadin.conf:/etc/nginx/default.vaadin.conf.template:ro
      - ziti-sandbox-runtime:/var/zt-runtime:ro
    depends_on:
      dns-server:
        condition: service_started
      ziti-setup:
        condition: service_started

  console-vaadin:
    profiles: ["vaadin"]
    image: ${BPC_VAADIN_IMAGE:-ghcr.io/moscait/baked-pasta-console-vaadin:0.2.3}
    container_name: console-vaadin.local
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: unless-stopped
    environment:
      - SERVER_SERVLET_CONTEXT_PATH=/zac
      # Required by BPC Vaadin >= 0.2.3: the only controller(s) the console may contact.
      - ZITI_CONTROLLERS=https://ziti-controller.local:1280
      # The controller's quickstart PKI is self-signed, and its certificate lists ziti-controller.local
      # only when that is also the advertise address, so hostname checks would fail. The traffic stays
      # on the private container network.
      - ZITI_TRUST_ALL=true
    depends_on:
      - ziti-controller
