---
- name: Verify supported distribution
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat']
    fail_msg: "Unsupported Linux distribution family: {{ ansible_facts['os_family'] }}. This deployment supports Ubuntu/Debian and Fedora/RedHat."

- name: Update apt cache and install base packages (Ubuntu/Debian)
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
    - name: Install base utility packages
      ansible.builtin.apt:
        name:
          - curl
          - jq
          - git
          - ca-certificates
          - gnupg
          - lsb-release
          - python3
          - python3-pip
        state: present

- name: Install base utility packages (Fedora/RedHat)
  when: ansible_facts['os_family'] == 'RedHat'
  block:
    - name: Install base utility packages
      ansible.builtin.dnf:
        name:
          - curl
          - jq
          - git
          - ca-certificates
          - gnupg2
          - python3
          - python3-pip
        state: present


