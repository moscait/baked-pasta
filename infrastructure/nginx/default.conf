# Nginx configuration for OpenZiti Admin Console (ZAC) & Edge Management API Proxy
#
# This listener is published on 127.0.0.1 only and is reached exclusively through
# cloudflared, so CF-Connecting-IP reliably identifies the real client.

server_tokens off;

# Resolve the controller at request time, so a controller restart (new container IP) does
# not leave nginx proxying to a stale address. This file is an nginx-image template:
# NGINX_LOCAL_RESOLVERS is filled in at startup from the container's /etc/resolv.conf,
# which is 127.0.0.11 under Docker and the network gateway (e.g. 10.89.0.1) under Podman.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-client key for rate limiting: real client IP from Cloudflare, else the socket peer.
map $http_cf_connecting_ip $client_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

# Client IP as text for the X-Real-IP header. $client_key can't be used there: without
# CF-Connecting-IP it is the 4-byte binary address, which the controller rejects (HTTP 400).
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Brute-force protection for the admin login (authenticate) endpoints.
limit_req_zone $client_key zone=ziti_auth:10m rate=10r/m;
# General ceiling for API traffic.
limit_req_zone $client_key zone=ziti_api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 8080 default_server;
    server_name _;

    port_in_redirect off;
    absolute_redirect off;

    set $ziti_mgmt_upstream https://ziti-controller.local:1281;

    # Security headers (applied to every response, including errors)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is set at the Cloudflare edge (TLS terminates there), not here.

    # OpenZiti Admin Console is the direct root application
    root /usr/share/nginx/html;
    index index.html;

    # Root SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Support /zac/ path for backwards compatibility
    location /zac/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Rate-limited login endpoints (password authentication)
    location ~ ^/edge/(management|client)/v1/authenticate {
        limit_req zone=ziti_auth burst=5 nodelay;
        proxy_pass $ziti_mgmt_upstream;
        # Internal docker network hop to the controller's self-signed quickstart PKI.
        proxy_ssl_verify off;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ZAC 4.3+ logs in through the controller's OIDC provider whenever /version advertises
    # OIDC_AUTH. That needs /oidc/ proxied to the controller's public 1280 listener AND
    # https://<console-host>/auth/callback registered in the controller's edge-oidc
    # redirectURIs; neither is configured here yet. Until then, hide the capability so ZAC
    # uses the classic password login (the rate-limited /authenticate location above).
    location ~ ^/edge/(management|client)/v1/version$ {
        limit_req zone=ziti_api burst=100 nodelay;
        proxy_pass $ziti_mgmt_upstream;
        proxy_ssl_verify off;
        proxy_set_header Host localhost;
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"OIDC_AUTH"' '"OIDC_AUTH_NOT_PROXIED"';
    }

    # Proxy Edge Management API requests to OpenZiti controller (internal management listener).
    # Exposed through the tunnel because ZAC needs it: protect the hostname with Cloudflare Access.
    location /edge/ {
        limit_req zone=ziti_api burst=100 nodelay;
        proxy_pass $ziti_mgmt_upstream;
        # Internal docker network hop to the controller's self-signed quickstart PKI.
        proxy_ssl_verify off;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
