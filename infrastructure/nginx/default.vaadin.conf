# Nginx reverse proxy for Baked Pasta Console (Vaadin edition)
#
# This listener is published on 127.0.0.1 only. It is reached through cloudflared (which sets
# CF-Connecting-IP to the real client) and, with CONSOLE_ACCESS=ziti or both, through the
# openziti-console-host tunneler on the container network as http://console.ziti/.
#
# SECURITY: Unlike the static SPA consoles (ZAC / BPC Web), the Vaadin backend talks
# directly to ziti-controller.local:1281 over the private container network. Neither
# /edge/ nor /fabric/ is proxied here, keeping the OpenZiti Management API dark.

server_tokens off;

# Resolve the Vaadin container at request time so a container restart (new IP) does not
# leave nginx proxying to a stale address.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-client key for rate limiting: real client IP from Cloudflare, else the socket peer.
map $http_cf_connecting_ip $client_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}

map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Over the OpenZiti overlay the browser uses plain http://console.ziti/ (the overlay encrypts the
# connection end to end), so the console's Secure session cookie would be dropped. For that host
# only, remove the Secure flag and tell the console the scheme is http, so it never sends HSTS.
map $host $console_cookie_secure {
    console.ziti nosecure;
    default      secure;
}

map $host $console_forwarded_proto {
    console.ziti http;
    default      $http_x_forwarded_proto;
}

# General ceiling for console traffic (UIDL, static assets, WebSocket handshakes).
limit_req_zone $client_key zone=ziti_api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 8080 default_server;
    server_name _;

    port_in_redirect off;
    absolute_redirect off;

    set $vaadin_upstream http://console-vaadin.local:8080;

    # Security headers (applied to every response, including errors)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is set at the Cloudflare edge (TLS terminates there), not here.

    location / {
        limit_req zone=ziti_api burst=100 nodelay;
        proxy_pass $vaadin_upstream;
        # The headers above cover every response (errors too); drop the console's copies so each
        # is sent once.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $console_forwarded_proto;
        proxy_cookie_flags ~ $console_cookie_secure;
        proxy_set_header X-Forwarded-Host $http_host;

        # WebSocket support for Vaadin @Push
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
