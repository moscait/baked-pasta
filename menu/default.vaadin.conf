# Nginx configuration for Baked Pasta Application Portal (Vaadin Console edition)

# Use Docker's internal DNS resolver to dynamically resolve container IPs
resolver 127.0.0.11 valid=10s;

server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Server block for the Application Menu
server {
    listen 8080;
    server_name menu-local menu.local localhost 127.0.0.1;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    # The Vaadin console only works over HTTPS: its session cookie is Secure, and browsers drop
    # Secure cookies on plain HTTP except for localhost. Send /zac to the HTTPS listener below.
    location = /zac {
        return 302 https://zt.local:8443/zac/;
    }

    location /zac/ {
        return 302 https://zt.local:8443/zac/;
    }

    # Serve ONLY the host-client enrollment token. The rest of config/ holds
    # private keys (zt.local.key, zt-app-identity.json) and must never be served.
    location = /config/zt-host-client.jwt {
        alias /var/zt-runtime/config/zt-host-client.jwt;
        default_type application/jwt;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /config/ {
        return 404;
    }

    # zt-app liveness heartbeat (written by the zt-app container to a shared volume)
    location = /status/zt-app-heartbeat.txt {
        alias /var/zt-runtime/status/zt-app-heartbeat.txt;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # Provisioning log written by the non-root ziti-setup container to the shared runtime volume
    location = /ziti-setup.log {
        alias /var/zt-runtime/config/ziti-setup.log;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # Add health check proxy to check if standard app is running in Docker
    location /api/app-status {
        set $upstream_app http://app.local:8080/;
        proxy_pass $upstream_app;

        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;

        # Intercept connection errors and return offline JSON
        proxy_intercept_errors on;
        error_page 502 504 = @app_down;
    }

    location @app_down {
        default_type application/json;
        return 502 '{"status": "offline", "container": "app.local", "running": false}';
    }

    # Add health check proxy to check if dns-server is running
    location /api/dns-status {
        set $upstream_dns http://dns-server:5380/;
        proxy_pass $upstream_dns;

        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;

        # Intercept connection errors and return offline JSON
        proxy_intercept_errors on;
        error_page 502 504 = @dns_down;
    }

    location @dns_down {
        default_type application/json;
        return 502 '{"status": "offline", "container": "dns-server", "running": false}';
    }

    # Proxy /edge/v1/version for the sandbox dashboard's controller status probe
    location = /edge/v1/version {
        set $upstream_ctrl https://ziti-controller.local:1280;
        proxy_pass $upstream_ctrl;
        proxy_ssl_verify off;

        proxy_set_header Host ziti-controller.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Server block for the Standard Application
server {
    listen 8080;
    server_name app.local;

    location / {
        # Using a variable forces dynamic resolution of the upstream container at runtime
        set $upstream_app http://app.local:8080;
        proxy_pass $upstream_app;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Required for Spring Boot / Vaadin Push framework)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Avoid timeouts for long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# Server block for Baked Pasta Console (Vaadin) at https://zt.local:8443
server {
    listen 8443 ssl;
    server_name zt.local;

    ssl_certificate /var/zt-runtime/config/zt.local.crt;
    ssl_certificate_key /var/zt-runtime/config/zt.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        return 301 /zac/;
    }

    location = /zac {
        return 301 /zac/;
    }

    # Proxy the Vaadin edition of Baked Pasta Console; controller APIs stay internal.
    location /zac/ {
        set $upstream_vaadin http://console-vaadin:8080;
        proxy_pass $upstream_vaadin;
        # This server block already sets these; drop the console's copies so each is sent once.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# Catch-all for unknown Host headers on 8080 (defeats DNS rebinding).
server {
    listen 8080 default_server;
    server_name _;
    return 404;
}
