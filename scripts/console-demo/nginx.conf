# Demo only: serve the console and proxy the controller APIs, as the deployment does.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
    location ~ ^/edge/(management|client)/v1/version$ {
        proxy_pass https://zdemo-ctrl:1280;
        proxy_ssl_verify off;
        proxy_set_header Host localhost;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"OIDC_AUTH"' '"OIDC_AUTH_NOT_PROXIED"';
    }
    location /edge/ {
        proxy_pass https://zdemo-ctrl:1280;
        proxy_ssl_verify off;
        proxy_set_header Host localhost;
    }
}
