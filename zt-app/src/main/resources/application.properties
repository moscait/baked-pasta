spring.application.name=zt-app

# Tomcat listens on loopback only. The app is reached through the OpenZiti overlay, which
# ZitiServiceBridge forwards to this listener; nothing on the network can connect directly.
server.address=127.0.0.1
server.port=8080

# OpenZiti binding. The bridge is active only when ziti.id is set; the sandbox passes
# -Dziti.id and -Dziti.serviceName. To run outside the sandbox, enroll an identity, save it as
# HelloZiti-host.json (git-ignored because it holds a private key; HelloZiti-host.example.json
# shows the format) and uncomment:
# ziti.id=HelloZiti-host.json

# The Ziti service to bind. Its Bind policy must include the identity above.
ziti.serviceName=helloziti
